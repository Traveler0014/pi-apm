[package]
name = "apm"
version = "0.1.0"
edition = "2024"
description = "AgentPM — local-first, agent-native work ledger (CLI + SQLite)"
license = "MIT"
repository = "https://github.com/Traveler0014/pi-apm"
keywords = ["agents", "tasks", "sqlite", "cli", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "apm"
path = "src/lib.rs"

[[bin]]
name = "apm"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
tempfile = "3.27.0"
