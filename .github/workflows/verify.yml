# Reusable verification job: formatting, lints, Rust tests, extension and UI
# type checks/tests, and the two cross-process stress checks.
#
# Called by ci.yml (push/PR) and release.yml (tags), so a release can never be
# published from a tree that would fail CI.
name: verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: fmt · clippy · tests · stress
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      # Third-party actions are pinned to commit SHAs (tag in the comment); see
      # docs/release.md for the update policy.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, toolchain: stable
        with:
          # Keep in sync with rust-toolchain.toml (single pinned version).
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Rust formatting
        run: cargo fmt --check

      - name: Rust lints
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests (library, CLI, MCP, REST, UI)
        run: cargo test --all-targets --locked

      - name: Node dependencies
        run: npm ci

      # `ui/dist` is committed and embedded at compile time (build.rs) for the
      # binaries this job tests and the release job publishes. A stale bundle
      # silently ships an old dashboard, and a missing one falls back to
      # `src/ui_fallback` (build.rs only checks that `ui/dist/index.html`
      # exists). Rebuild and require the *whole* directory to match git.
      #
      # `--porcelain` is deliberate: Vite content-hashes asset filenames, so a
      # rebuilt bundle adds untracked files and removes tracked ones. A plain
      # `git diff --exit-code ui/dist` would miss the untracked half and pass.
      - name: ui/dist is up to date
        run: |
          npm run ui:build
          test -s ui/dist/index.html || {
            echo "::error::ui/dist/index.html is missing; the binary would fall back to src/ui_fallback"
            exit 1
          }
          if [ -n "$(git status --porcelain --untracked-files=all ui/dist)" ]; then
            echo "::error::ui/dist is stale: run 'npm run ui:build' and commit the result"
            git status --porcelain --untracked-files=all ui/dist
            git diff --stat ui/dist
            exit 1
          fi

      - name: TypeScript (extension + dashboard)
        run: |
          npx tsc -p tsconfig.json
          npm run ui:typecheck

      - name: Extension and UI tests
        run: npx vitest run

      # Both scripts spawn real processes against a throwaway SQLite ledger.
      # CI uses a smaller racing set than the local default (10) for runtime.
      - name: Stress (CLI claim/write races)
        run: bash scripts/stress.sh 3

      - name: Stress (REST + mixed writers)
        run: bash scripts/stress-rest.sh 3

      # No network, no token: fake `gh`/`cygpath`/`7z` on PATH exercise the
      # publish create/update paths and the Windows packaging branch.
      - name: Release script tests
        run: |
          bash scripts/test-release-scripts.sh
          bash scripts/test-package-windows.sh
          bash scripts/test-release-gate.sh
