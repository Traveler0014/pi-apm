# Cross-platform build and GitHub Release.
#
#   push main (Cargo.toml)  gate → verify → build → auto-tag v<version> → publish
#   tag push v*             gate → verify → build → publish
#   workflow_dispatch       gate → verify → build → artifacts only (no release)
#
# The gate reads Cargo.toml and skips the whole pipeline when both the tag and
# its Release already exist, so bumping the version is the only action needed.
# A tag created with GITHUB_TOKEN does not trigger another workflow run, which
# is what keeps auto-tagging from recursing.
#
# Artifacts: apm, apm-mcp and apm-serve for Linux x64/arm64, macOS x64/arm64
# and Windows x64. Each archive carries README.md, LICENSE and SHA256SUMS; the
# release also publishes an aggregate SHA256SUMS.txt.
#
# Runner strategy: native runners where this account provides them
# (ubuntu-24.04-arm, windows-2022, macos-15-intel). The arm64 macOS runner is not
# available here, so macOS x86_64 is built natively on the Intel image and
# aarch64-apple-darwin is cross-compiled on the same runner: the macOS SDK is
# universal, so `rustup target add aarch64-apple-darwin` plus `cargo build
# --target` is enough — no extra toolchain or Docker. See docs/release.md for
# label fallbacks.
name: release

on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: decide whether to release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      auto_tag: ${{ steps.decide.outputs.auto_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read version, check tag and release
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-gate.sh >> "$GITHUB_OUTPUT"

  verify:
    if: needs.gate.outputs.run == 'true'
    needs: gate
    uses: ./.github/workflows/verify.yml

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            smoke: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            smoke: true
          # An x64 image is used because this account has no arm64 macOS
          # runner: `macos-15`/`macos-26`/`macos-latest` resolve to arm64 here.
          # `macos-15-intel` is the official x64 (Intel) macOS 15 image, published
          # in actions/runner-images and supported until 2027-08. actionlint's
          # static runner-label list can lag and report it as unknown; the
          # official image table wins. x86_64 is native; aarch64 is cross-built
          # on the same universal SDK.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            smoke: true
          - os: macos-15-intel
            target: aarch64-apple-darwin
            smoke: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            smoke: true
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, toolchain: stable
        with:
          # Keep in sync with rust-toolchain.toml (single pinned version).
          toolchain: 1.100.0
          targets: ${{ matrix.target }}

      # `ui/dist` is committed and embedded by build.rs, so this needs no Node.
      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" \
            --bin apm --bin apm-mcp --bin apm-serve

      - name: Smoke test (native binaries)
        if: matrix.smoke
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release"
          for exe in apm apm-mcp apm-serve; do
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              "$bin/$exe.exe" --version
            else
              "$bin/$exe" --version
            fi
          done

      - name: Package
        shell: bash
        run: |
          bash scripts/package-release.sh \
            --target "${{ matrix.target }}" \
            --bin-dir "target/${{ matrix.target }}/release" \
            --outdir dist

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apm-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: tag and publish GitHub release
    if: needs.gate.outputs.publish == 'true'
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Least privilege: only this job may write, and only repository contents.
    # `actions: read` lets download-artifact list this run's artifacts.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      # A GITHUB_TOKEN-created tag does not start another workflow run.
      - name: Create tag when the version is new
        if: needs.gate.outputs.auto_tag == 'true'
        shell: bash
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Verify tag matches Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="${{ needs.gate.outputs.tag }}"
          if [[ "$version" != "${tag#v}" ]]; then
            echo "tag $tag does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Aggregate checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt

      - name: Publish or refresh release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent: create on the first run, upload --clobber + title sync on
        # a workflow re-run or after a partial upload. See the script's header.
        run: bash scripts/publish-release.sh "${{ needs.gate.outputs.tag }}" dist
