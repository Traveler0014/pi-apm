# Cross-platform build and GitHub Release.
#
#   tag push v*        verify → build matrix → package → publish release
#   workflow_dispatch  verify → build matrix → artifacts only (no release)
#
# Artifacts: apm, apm-mcp and apm-serve for Linux x64/arm64, macOS x64/arm64
# and Windows x64. Each archive carries README.md, LICENSE and SHA256SUMS; the
# release also publishes an aggregate SHA256SUMS.txt.
#
# Runner strategy: native runners where GitHub provides them (ubuntu-24.04-arm,
# macos-14 arm64, windows-2022). macOS x86_64 is cross-compiled on the arm64
# runner: the macOS SDK is universal, so `rustup target add x86_64-apple-darwin`
# plus `cargo build --target` is enough — no extra toolchain or Docker. See
# docs/release.md for fallbacks if a runner label is unavailable.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            smoke: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            smoke: true
          - os: macos-14
            target: aarch64-apple-darwin
            smoke: true
          # Cross-compiled on the arm64 runner; the binary cannot be executed
          # here without Rosetta, so only its presence/size is checked.
          - os: macos-14
            target: x86_64-apple-darwin
            smoke: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            smoke: true
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, toolchain: stable
        with:
          # Keep in sync with rust-toolchain.toml (single pinned version).
          toolchain: 1.100.0
          targets: ${{ matrix.target }}

      # `ui/dist` is committed and embedded by build.rs, so this needs no Node.
      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" \
            --bin apm --bin apm-mcp --bin apm-serve

      - name: Smoke test (native binaries)
        if: matrix.smoke
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release"
          for exe in apm apm-mcp apm-serve; do
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              "$bin/$exe.exe" --version
            else
              "$bin/$exe" --version
            fi
          done

      - name: Package
        shell: bash
        run: |
          bash scripts/package-release.sh \
            --target "${{ matrix.target }}" \
            --bin-dir "target/${{ matrix.target }}/release" \
            --outdir dist

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apm-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Least privilege: only this job may write, and only repository contents.
    # `actions: read` lets download-artifact list this run's artifacts.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify tag matches Cargo.toml
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Aggregate checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt

      - name: Publish or refresh release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent: create on the first run, upload --clobber + title sync on
        # a workflow re-run or after a partial upload. See the script's header.
        run: bash scripts/publish-release.sh "${GITHUB_REF_NAME}" dist
