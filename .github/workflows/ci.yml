# Continuous integration: every branch push and pull request runs the shared
# verify workflow. Release packaging lives in release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
